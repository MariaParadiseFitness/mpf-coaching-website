<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business | MPF Coaching</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-title" content="MPF Coach">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/portal/coach/manifest.webmanifest">
<link rel="stylesheet" href="/portal/log.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A64B;--gold-l:#E4CF8A;--gold-d:#9C7A2C;--grad:linear-gradient(120deg,#9C7A2C 0%,#C9A64B 45%,#E8D79A 100%);--serif:"Playfair Display",Georgia,serif;--sans:"Montserrat",system-ui,sans-serif;--card:#151410;--line:rgba(201,166,75,.28);--mute:#b5a988;--soft:#cfc4aa}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--sans);color:#efe6cf;background:radial-gradient(90% 50% at 50% 0%,#221f17 0%,#0e0e0e 65%) fixed,#0e0e0e;-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:var(--gold-l)}
.top{position:sticky;top:0;z-index:20;background:rgba(14,14,14,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,166,75,.18)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 22px;display:flex;justify-content:space-between;align-items:center}
.top img{height:34px;display:block}
.top a.o{color:var(--mute);font-size:12px;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:30px 22px 70px}
.kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,5vw,42px);color:#fff;line-height:1.1}
h1 em,h2 em{font-style:italic;font-weight:400;color:var(--gold-l)}
h2{font-family:var(--serif);font-weight:900;font-size:26px;color:#fff;margin-bottom:4px}
.sub{color:var(--mute);font-size:14px;margin:4px 0 22px}
.preview{background:#2a2315;border:1px solid var(--gold);color:var(--gold-l);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:22px;text-align:center}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:26px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sum small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sum b{font-family:var(--serif);font-size:28px;color:#fff}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--soft);font:inherit;font-size:12px;font-weight:600;padding:8px 14px;border-radius:30px;cursor:pointer}
.filters button.on{background:var(--grad);color:#111;border-color:transparent}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{text-align:left;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:0 14px}
td{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px;font-size:14px;color:var(--soft);vertical-align:middle}
td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}
td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
tr.row{cursor:pointer}
tr.row:hover td{border-color:var(--gold-l)}
td b{color:#fff;font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.04em}
.ok{background:rgba(47,163,91,.18);color:#7fd8a0}
.part{background:rgba(224,123,34,.18);color:#f0b27a}
.none{background:rgba(217,72,59,.18);color:#ef8f85}
.off{background:#222;color:#888}
.mini a{font-size:12px;margin-right:10px}
/* client panel */
.panel{background:var(--card);border:1px solid var(--gold-l);border-radius:22px;padding:24px 22px;margin-top:24px}
#panel{position:fixed;inset:0;z-index:40;margin:0;border-radius:0;border:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(22px,calc((100vw - 1100px)/2)) 60px;background:#0e0e0e}
#panel .ph-head{position:sticky;top:0;z-index:5;background:rgba(14,14,14,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:16px 0 12px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-block;background:var(--grad);color:#111;text-decoration:none;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border-radius:40px;border:0;cursor:pointer;font-family:inherit}
.btn.g{background:transparent;color:var(--gold-l);border:1px solid var(--line)}
.ph-row{display:grid;grid-template-columns:90px repeat(3,1fr);gap:10px;align-items:center;margin-bottom:10px;max-width:720px}
.ph-row .wk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.ph-row .wk input{accent-color:#C9A64B;margin-right:6px}
.ph-row a,.ph-row span.e{display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0e0e0e}
.ph-row img{width:100%;height:100%;object-fit:cover;display:block}
.ph-row span.e{display:grid;place-content:center;color:#4d463a;font-size:12px}
.hdr{max-width:720px;display:grid;grid-template-columns:90px repeat(3,1fr);gap:10px;margin-bottom:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:700;text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;max-width:900px}
.cmp h3{font-family:var(--serif);color:#fff;font-size:18px;margin-bottom:8px;text-align:center}
.cmp .three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cmp img,.cmp span{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#0e0e0e}
.msg{max-width:560px;margin:60px auto;text-align:center}
.msg p{color:var(--soft);margin:12px 0 20px}
@media(max-width:700px){.hide-m{display:none}.ph-row,.hdr{grid-template-columns:60px repeat(3,1fr);gap:6px}.cmp{grid-template-columns:1fr}}
.wc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;max-width:760px}
.wc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.wc-stats div{background:#0e0e0e;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wc-stats small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.wc-stats b{font-family:var(--serif);font-size:22px;color:#fff}
.wc-range{display:flex;gap:6px;margin-bottom:8px}
.wc-range button{background:#0e0e0e;border:1px solid var(--line);color:var(--soft);font:inherit;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:30px;cursor:pointer}
.wc-range button.on{background:var(--grad);color:#111;border-color:transparent}
.wc-key{font-size:12px;color:var(--mute);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wc-key span{display:inline-block;width:18px;height:3px;border-radius:2px}
.wc-key .k1{background:var(--grad)}
.wc-key .k2{width:7px;height:7px;border-radius:50%;background:#6b5f43;margin-left:10px}
.wc-empty{color:var(--mute);font-size:14px;padding:20px 4px;text-align:center}
@media(max-width:600px){.wc-stats b{font-size:17px}}
.cav{width:34px;height:34px;border-radius:50%;object-fit:cover;float:left;margin:2px 10px 0 0;border:1.5px solid var(--gold)}

/* phone layout */
html,body{overflow-x:hidden}
.filters{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;white-space:nowrap}
@media(max-width:820px){
  .wrap{padding:20px 14px 60px}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tr.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
  tr.row td{display:block;background:none;border:0!important;padding:0;border-radius:0!important}
  tr.row td:first-child{grid-column:1/-1}
  tr.row td.hide-m{display:none}
  .cav{width:30px;height:30px}
  .panel{position:fixed;inset:0;z-index:40;margin:0;border-radius:0;border:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 40px;background:#0e0e0e}
  .panel .ph-head{position:sticky;top:0;z-index:5;background:rgba(14,14,14,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 0 10px;margin:0 -14px 12px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line);flex-wrap:nowrap;align-items:center}
  .panel .ph-head h2{font-size:22px}
  .sum{grid-template-columns:1fr 1fr;gap:8px}
  .sum b{font-size:24px}
}
.calc-h{font-family:var(--serif);color:#fff;font-size:19px;margin-bottom:10px}
.lg-f select{width:100%;background:#0e0e0e;border:1px solid var(--line);border-radius:12px;color:#fff;font:inherit;font-size:16px;padding:11px 12px}
.calc-sum{font-size:13px;color:var(--soft);margin:12px 0 8px}.calc-sum b{color:#fff}
.calc-day{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;background:#0e0e0e;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.calc-day b{color:var(--gold-l);min-width:110px}.calc-day span{color:#fff}
.ci-ans .flag{background:rgba(217,72,59,.12);border-radius:8px;padding:10px}

h1{font-family:var(--serif);color:#fff;font-size:34px;font-weight:400;margin-bottom:4px}h1 em{color:var(--gold-l)}
h2{font-family:var(--serif);color:#fff;font-weight:400;font-size:22px;margin:30px 0 12px}h2 em{color:var(--gold-l)}
.sub{color:var(--mute,#9b927f);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:18px}
.tile{background:#141414;border:1px solid rgba(201,166,75,.25);border-radius:16px;padding:14px 16px}
.tile small{display:block;color:var(--gold);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.tile b{display:block;color:#fff;font-size:26px;font-family:var(--serif);margin-top:4px}
.tile span{font-size:12px;color:#9b927f}
.tile.hi{border-color:var(--gold);background:linear-gradient(160deg,rgba(201,166,75,.16),#141414)}
.card{background:#141414;border:1px solid rgba(201,166,75,.2);border-radius:16px;padding:16px}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:20px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;max-width:38px;background:var(--grad);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.old i{background:#3a3326}
.bar em{font-style:normal;font-size:10px;color:#e6cf8b;margin-bottom:4px;white-space:nowrap}
.bar small{font-size:10px;color:#9b927f;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(201,166,75,.12)}th{color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase}td.n,th.n{text-align:right}
.lst{display:flex;flex-direction:column;gap:6px}.lst div{display:flex;justify-content:space-between;gap:10px;background:#0f0f0f;border:1px solid rgba(201,166,75,.15);border-radius:12px;padding:10px 12px;font-size:14px}.lst div b{color:#fff;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.note{font-size:12px;color:#9b927f;margin-top:10px;line-height:1.5}
.seg{display:inline-flex;border:1px solid rgba(201,166,75,.35);border-radius:30px;overflow:hidden;margin-top:6px}.seg button{background:none;border:0;color:#e6cf8b;font:inherit;font-size:12px;padding:8px 14px;cursor:pointer}.seg button.on{background:var(--gold);color:#111;font-weight:700}
.back{color:var(--gold-l);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="top"><div class="in"><a href="/portal/coach/"><img src="/img/logo.png" alt="MPF Coaching"></a><a class="o" href="/portal/coach/">← Clients</a></div></div>
<div class="wrap">
  <h1>Your <em>business.</em></h1>
  <div class="sub" id="src">Loading…</div>
  <div class="tiles" id="tiles"></div>
  <h2>Money in, <em>by month</em></h2>
  <div class="card"><div class="seg" id="seg"><button data-k="gross" class="on">Takings</button><button data-k="net">After Stripe fees</button></div><div class="chart" id="chart"></div><div class="note" id="cmp"></div></div>
  <div class="two">
    <div><h2>Coming <em>up</em></h2><div class="card"><div class="lst" id="renew"></div></div></div>
    <div><h2>Needs <em>you</em></h2><div class="card"><div class="lst" id="needs"></div></div></div>
  </div>
  <h2>Monthly <em>breakdown</em></h2>
  <div class="card" style="overflow-x:auto"><table id="tbl"></table></div>
  <div class="note" id="foot"></div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var gbp=function(n){return n==null?'–':'£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0})};
  var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var nice=function(d){var p=d.split('-');return +p[2]+' '+MN[+p[1]-1]};
  var D,key='gross';
  function load(fresh){fetch('/portal/api/coach/business'+(fresh?'?fresh=1':''),{credentials:'same-origin',cache:'no-store'}).then(function(r){if(r.status===403){location.replace('/portal/');throw 0}return r.json()}).then(function(j){D=j;draw()}).catch(function(e){if(e)$('src').textContent='Could not load. Refresh to try again.'})}
  function sum(ms,pre,k){var t=0;Object.keys(ms).forEach(function(m){if(m.indexOf(pre)===0&&ms[m][k]!=null)t+=ms[m][k]});return t}
  function draw(){
    var j=D,ms=j.money.months||{},t=j.today,y=t.slice(0,4),m=t.slice(0,7),ly=String(+y-1),lm=(function(){var d=new Date(Date.UTC(+y,+t.slice(5,7)-2,1));return d.toISOString().slice(0,7)})();
    var lyToDate=Object.keys(ms).filter(function(k){return k.indexOf(ly)===0&&k.slice(5)<=t.slice(5,7)}).reduce(function(a,k){return a+(ms[k][key]||0)},0);
    $('src').innerHTML=(j.source==='stripe'?'Live from Stripe':'From payments the portal has seen. Add a Stripe read key for your full history')+' · '+new Date().toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · <a href="#" id="rf">Refresh</a>'+(j.err?'<br><span style="color:#e88">Stripe: '+esc(j.err)+'</span>':'');
    $('rf').onclick=function(e){e.preventDefault();$('src').textContent='Refreshing…';load(true)};
    var c=j.clients,pt=j.pt||{months:{}};
    var tiles=[
      ['This month',gbp(sum(ms,m,key)),MN[+m.slice(5)-1]+' so far',1],
      ['This year',gbp(sum(ms,y,key)),y+' so far',1],
      ['Last month',gbp(sum(ms,lm,key)),MN[+lm.slice(5)-1]],
      ['Last year',gbp(sum(ms,ly,key)),ly+' · same point: '+gbp(lyToDate)],
      ['Monthly recurring',j.money.mrr!=null?gbp(j.money.mrr):'–',j.money.mrr!=null?'≈ '+gbp(j.money.mrr*12)+' a year':'needs Stripe key'],
      ['Paying online',j.money.subs,(j.money.cancelling?j.money.cancelling+' cancelling':'none cancelling')],
      ['Clients',c.online+c.pt,c.online+' online · '+c.pt+' face to face'],
      ['New this month',c.newThisMonth.length,c.newThisMonth.slice(0,3).join(', ')||'–'],
      ['PT sessions',pt.months[m]||0,MN[+m.slice(5)-1]+' · '+(pt.next7||0)+' in next 7 days'],
    ];
    if(j.money.balance)tiles.push(['Stripe balance',gbp(j.money.balance.available),gbp(j.money.balance.pending)+' on the way']);
    $('tiles').innerHTML=tiles.map(function(x){return '<div class="tile'+(x[3]?' hi':'')+'"><small>'+x[0]+'</small><b>'+x[1]+'</b><span>'+esc(x[2])+'</span></div>'}).join('');
    var keys=[];for(var i=11;i>=0;i--){var d=new Date(Date.UTC(+y,+t.slice(5,7)-1-i,1));keys.push(d.toISOString().slice(0,7))}
    var vals=keys.map(function(k){return ms[k]&&ms[k][key]!=null?ms[k][key]:0}),mx=Math.max.apply(null,vals.concat([1]));
    $('chart').innerHTML=keys.map(function(k,i){return '<div class="bar'+(k.slice(0,4)!==y?' old':'')+'"><em>'+(vals[i]?gbp(vals[i]):'')+'</em><i style="height:'+(vals[i]/mx*100)+'%"></i><small>'+MN[+k.slice(5)-1]+'</small></div>'}).join('');
    var tm=sum(ms,m,key),lmv=sum(ms,lm,key);$('cmp').textContent=lmv?('This month is '+(tm>=lmv?'up ':'down ')+Math.abs(Math.round((tm-lmv)/lmv*100))+'% on last month so far.'):'';
    $('seg').onclick=function(e){var b=e.target.closest('button');if(!b)return;key=b.getAttribute('data-k');[].forEach.call($('seg').children,function(x){x.classList.toggle('on',x===b)});draw()};
    $('renew').innerHTML=(j.renewals.length?j.renewals.map(function(x){return '<div><span><b>'+esc(x.name)+'</b> renews</span><span>'+nice(x.date)+(x.amount?' · '+gbp(x.amount):'')+'</span></div>'}).join(''):'<div><span>No renewals in the next 14 days</span></div>');
    var needs=[];
    j.failed.forEach(function(x){needs.push('<div><span>💳 <b>'+esc(x.name)+'</b> payment failed</span><span>Message them</span></div>')});
    j.cancelReqs.forEach(function(x){needs.push('<div><span>🛑 <b>'+esc(x.name)+'</b> asked to cancel</span><span>'+nice(x.date)+'</span></div>')});
    j.ending.forEach(function(x){needs.push('<div><span>⏳ <b>'+esc(x.name)+'</b> ends</span><span>'+nice(x.date)+'</span></div>')});
    c.notOnboarded.forEach(function(n){needs.push('<div><span>📝 <b>'+esc(n)+'</b> hasn\'t finished onboarding</span><span></span></div>')});
    $('needs').innerHTML=needs.join('')||'<div><span>All good 👌</span></div>';
    var rows=Object.keys(ms).sort().reverse();
    $('tbl').innerHTML='<tr><th>Month</th><th class="n">Payments</th><th class="n">Takings</th><th class="n">Refunds</th><th class="n">Stripe fees</th><th class="n">You keep</th><th class="n">PT sessions</th></tr>'+rows.map(function(k){var o=ms[k];return '<tr><td>'+MN[+k.slice(5)-1]+' '+k.slice(0,4)+'</td><td class="n">'+o.count+'</td><td class="n">'+gbp(o.gross)+'</td><td class="n">'+(o.refunds?gbp(o.refunds):'–')+'</td><td class="n">'+(o.fees!=null?gbp(o.fees):'–')+'</td><td class="n"><b style="color:#fff">'+(o.net!=null?gbp(o.net):'–')+'</b></td><td class="n">'+(pt.months[k]||'–')+'</td></tr>'}).join('')+'<tr><td><b>'+y+' total</b></td><td></td><td class="n"><b>'+gbp(sum(ms,y,'gross'))+'</b></td><td class="n">'+gbp(sum(ms,y,'refunds'))+'</td><td class="n">'+gbp(sum(ms,y,'fees'))+'</td><td class="n"><b style="color:#e6cf8b">'+gbp(sum(ms,y,'net'))+'</b></td><td></td></tr>';
    $('foot').textContent='Takings = money paid to you through Stripe. "You keep" = after Stripe fees and refunds, before tax. Payments taken outside Stripe (cash, bank transfer, Squarespace if it uses a different account) are not included.';
  }
  load(false);
})();
</script>
</body>
</html>
