<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recommended by Maria | MPF Coaching</title>
<link rel="canonical" href="https://mpfcoaching.co.uk/recommended.html">
<meta name="description" content="The books, podcasts and tools Maria Paradise recommends to her coaching clients for fat loss, habits, mindset and training.">
<link rel="icon" type="image/png" href="img/favicon.png">
<meta property="og:title" content="Recommended by Maria | MPF Coaching"><meta property="og:description" content="Books, podcasts and tools I genuinely rate.">
<meta property="og:image" content="https://mpfcoaching.co.uk/img/og.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A64B;--gold-l:#E4CF8A;--gold-d:#9C7A2C;--ink:#111;--cream:#FBF7EE;--muted:#5b5547;
--grad:linear-gradient(120deg,#9C7A2C 0%,#C9A64B 45%,#E8D79A 100%);
--serif:"Playfair Display",Georgia,serif;--sans:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:16px;line-height:1.65;color:#1b1a17;background:var(--cream);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
a{color:var(--gold-d)}
.top{position:sticky;top:0;z-index:5;background:rgba(17,17,17,.95);padding:10px 0}
.top .wrap{display:flex;justify-content:space-between;align-items:center}
.top a{color:var(--gold-l);text-decoration:none;font-size:13px;font-weight:600}
.top .cta{background:var(--grad);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.cover{background:#111;color:#fff;text-align:center;padding:52px 0 56px;position:relative}
.cover:before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,166,75,.4);pointer-events:none}
.cover img{width:140px;margin:0 auto 24px;display:block}
.kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-l);margin-bottom:14px}
.cover h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.05}
.cover h1 em{display:block;font-style:italic;font-weight:400;color:var(--gold)}
.cover .sub{font-family:var(--serif);font-style:italic;font-size:19px;color:#d8ccb0;margin-top:14px}
.cover .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.cover .tags span{border:1px solid rgba(201,166,75,.5);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--gold-l)}
.cover .pdf{display:inline-block;margin-top:22px;color:var(--gold-l);font-size:13px}
section.ch{padding:40px 0 6px}
.num{font-family:var(--serif);font-weight:900;font-size:14px;color:var(--gold-d);letter-spacing:.14em;text-transform:uppercase}
h2.t{font-family:var(--serif);font-weight:900;font-size:clamp(26px,6.5vw,34px);line-height:1.12;margin:4px 0 14px}
h3{font-family:var(--serif);font-weight:700;font-size:20px;margin:20px 0 6px}
p{margin-bottom:12px}
ul.b{list-style:none;margin:4px 0 14px}
ul.b li{position:relative;padding-left:24px;margin-bottom:8px}
ul.b li:before{content:"";position:absolute;left:0;top:8px;width:11px;height:11px;border-radius:50%;background:var(--grad)}
.lol{font-family:var(--serif);font-style:italic;color:var(--gold-d)}
.note{background:#111;color:#e9e0c9;border-radius:10px;padding:18px 20px;margin:18px 0;font-size:15px}
.note b{color:var(--gold);letter-spacing:.14em;font-size:11px;display:block;margin-bottom:6px}
.note a{color:var(--gold-l);font-weight:600}
.key{background:#f1e8cf;border-left:4px solid var(--gold);padding:14px 18px;border-radius:0 8px 8px 0;margin:16px 0;font-size:15px}
table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
th{background:#111;color:var(--gold-l);text-align:left;padding:9px 10px;font-size:12px}
td{padding:9px 10px;border-top:1px solid rgba(156,122,44,.2);vertical-align:top}
td:first-child{font-weight:600}
tr.total td{background:#f1e8cf;font-weight:700}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 54px;border-bottom:1px solid rgba(156,122,44,.2)}
.steps li:before{content:counter(s);position:absolute;left:0;top:12px;width:38px;height:38px;border-radius:50%;background:var(--grad);font-family:var(--serif);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:17px}
.steps b{display:block;font-family:var(--serif);font-size:17px}

/* calculator */
.calc{background:#111;color:#f3ecdc;border-radius:16px;padding:24px 20px;margin:18px 0;border:1px solid rgba(201,166,75,.4)}
.calc h3{color:#fff;margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fld label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;font-weight:600}
.fld input,.fld select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(201,166,75,.45);background:#1d1c19;color:#fff;font-family:var(--sans);font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:11px 8px;border-radius:10px;border:1px solid rgba(201,166,75,.45);background:#1d1c19;color:#e9e0c9;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--grad);color:var(--ink);border-color:transparent}
.res{margin-top:18px;display:none}
.res.show{display:block}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big div{background:#1d1c19;border:1px solid rgba(201,166,75,.35);border-radius:12px;padding:14px}
.big small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.big b{font-family:var(--serif);font-size:26px;color:#fff;display:block;line-height:1.2}
.big span{font-size:12px;color:#cfc4aa}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macros div{border-radius:12px;padding:12px 8px;text-align:center;background:#1d1c19;border:1px solid rgba(201,166,75,.35)}
.macros small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.macros b{font-family:var(--serif);font-size:22px;color:#fff}
.bar{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block}
.legend{font-size:11px;color:#cfc4aa;display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.meals{margin-top:14px;background:#1d1c19;border-radius:12px;padding:14px;border:1px solid rgba(201,166,75,.35)}
.meals p{margin:8px 0 0;font-size:14px;color:#e9e0c9}
.warn{display:none;margin-top:12px;background:#3a2a10;border:1px solid var(--gold);border-radius:10px;padding:12px;font-size:13px;color:#f3e3b8}
.fine{font-size:12px;color:#a89a78;margin-top:12px}

/* tabs */
.tabs{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:20px;border:1.5px solid var(--gold-d);background:none;color:var(--gold-d);font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer}
.tabs button.on{background:#111;color:var(--gold-l);border-color:#111}
.pane{display:none}
.pane.on{display:block}

/* checklist */
.check label{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:10px;padding:13px 14px;margin-bottom:8px;border:1px solid rgba(156,122,44,.25);cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;accent-color:#9C7A2C;flex:0 0 auto;margin-top:2px}
.score{font-family:var(--serif);font-size:18px;margin-top:6px}

.cta-box{background:#111;color:#fff;text-align:center;border-radius:14px;padding:32px 22px;margin:36px 0}
.cta-box h2{font-family:var(--serif);font-size:26px;margin-bottom:10px}
.cta-box p{color:#d8ccb0}
.btn{display:inline-block;background:var(--grad);color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:16px 24px;border-radius:40px;margin:4px}
.btn.ghost{background:none;border:1.5px solid var(--gold);color:var(--gold)}
.disc{font-size:12px;color:#5b5547;border-top:1px solid rgba(156,122,44,.3);padding-top:14px;margin:20px 0 34px}
footer{background:#0b0b0a;color:#6f6754;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:22px 0}

.toc{background:#fff;border:1px solid rgba(156,122,44,.25);border-radius:12px;padding:16px 18px;margin:26px 0 6px}.toc b{font-family:var(--serif);font-size:17px}.toc ol{margin:8px 0 0 20px}.toc li{margin:3px 0}
.ok,.no{border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}.ok{background:#eaf3e6;border-left:4px solid #5b9a4a}.no{background:#f7e7e4;border-left:4px solid #c0584a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.pct{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pct div{background:#1d1c19;border:1px solid rgba(201,166,75,.35);border-radius:12px;padding:12px 8px;text-align:center}.pct small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.pct b{font-family:var(--serif);font-size:24px;color:#fff}
.recs{display:grid;gap:12px;margin:34px 0 40px}.rec{display:flex;gap:14px;background:#fff;border:1px solid #e8dfc8;border-radius:16px;padding:16px;color:#1b1a17;text-decoration:none;box-shadow:0 4px 18px rgba(0,0,0,.04)}a.rec:hover{border-color:var(--gold)}
.rec .ri{flex:none;width:52px;height:52px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:24px}.rec b{display:block;font-family:var(--serif);font-size:19px}.rec .rcov{flex:none;width:84px;height:128px;object-fit:cover;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.25)}.rec small{display:block;color:var(--gold-d);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 6px}.rec p{font-size:14.5px;color:#4a453a}.rec i{display:block;font-style:normal;color:var(--gold-d);font-weight:700;font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--muted);margin:40px 0}.foot-cta{background:#111;color:#fff;border-radius:18px;padding:26px;text-align:center;margin:10px 0 50px}.foot-cta h3{color:#fff;margin:0 0 6px}.foot-cta a{display:inline-block;margin-top:12px;background:var(--grad);color:#111;padding:11px 20px;border-radius:24px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
footer{text-align:center;padding:30px 0;font-size:12px;color:#a89a78;background:#111}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a href="index.html">← MPF Coaching</a><a class="cta" href="/portal/">Client portal</a></div></div>

<header class="cover"><div class="wrap">
  <img src="img/logo.png" alt="MPF Coaching">
  <div class="kick">Free resources · MPF Coaching</div>
  <h1>Recommended <em>by Maria</em></h1>
  <div class="sub">Books, podcasts and tools I genuinely rate</div>
</div></header>

<main class="wrap">
  <div class="recs" id="recs"><p class="empty">Loading…</p></div>
  <div class="foot-cta"><h3>Want help putting it into practice?</h3><p style="color:#d8ccb0">Reading is the start. Coaching is where it sticks.</p><a href="book.html">Book your free call</a></div>
</main>

<footer>MPF Coaching · Maria Paradise · <a href="privacy.html" style="color:#a89a78">Privacy</a></footer>
<script>
(function(){var ic={book:'📖',podcast:'🎧',app:'📱',video:'🎬',other:'⭐'},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},el=document.getElementById('recs');
fetch('/api/recs',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var it=j.items||[];if(!it.length){el.innerHTML='<p class="empty">Recommendations coming soon.</p>';return}
el.innerHTML=it.map(function(x){var amz=/amazon\./.test(x.link||''),inner=(x.img?'<img class="rcov" src="'+esc(x.img)+'" alt="" loading="lazy">':'<span class="ri">'+(ic[x.type]||'⭐')+'</span>')+'<span><b>'+esc(x.title)+'</b><small>'+esc(x.type)+(x.by?' · '+esc(x.by):'')+'</small>'+(x.why?'<p>'+esc(x.why)+'</p>':'')+(x.link?'<i>'+(amz?'Get it on Amazon →':'Have a look →')+'</i>':'')+'</span>';return x.link?'<a class="rec" href="'+esc(x.link)+'" target="_blank" rel="noopener">'+inner+'</a>':'<div class="rec">'+inner+'</div>'}).join('')}).catch(function(){el.innerHTML='<p class="empty">Could not load right now. Try again in a minute.</p>'})})();
</script>
</body>
</html>
