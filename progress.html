<style>
:root{--gold:#C9A64B;--gold-l:#E4CF8A;--gold-d:#9C7A2C;--ink:#0e0e0e;--cream:#FBF7EE;
--grad:linear-gradient(120deg,#9C7A2C 0%,#C9A64B 45%,#E8D79A 100%);
--serif:"Playfair Display",Georgia,serif;--sans:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.6;color:#efe6cf;background:radial-gradient(90% 60% at 50% 0%,#1d1b16 0%,#0e0e0e 70%) fixed,#0e0e0e;-webkit-font-smoothing:antialiased}
a{color:var(--gold-l)}
.top{position:sticky;top:0;z-index:5;background:rgba(14,14,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,166,75,.18)}
.top .in{max-width:760px;margin:0 auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center}
.top a{color:var(--gold-l);text-decoration:none;font-size:13px;font-weight:600}
.top .cta{background:var(--grad);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.stage{max-width:680px;margin:0 auto;padding:34px 22px 70px;min-height:calc(100vh - 56px);display:flex;flex-direction:column;justify-content:center}
.card{position:relative;background:#141310;border:1px solid rgba(201,166,75,.38);border-radius:22px;padding:34px 26px;box-shadow:0 0 0 1px rgba(232,206,130,.08),0 0 40px rgba(201,166,75,.12);animation:in .45s ease both}
@media(min-width:640px){.card{padding:44px 42px}}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:12px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,8.5vw,50px);line-height:1.05;color:#fff;margin-bottom:16px}
h1 em,h2 em{color:var(--gold-l);font-style:italic;font-weight:400}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(24px,6vw,32px);line-height:1.2;color:#fff;margin-bottom:22px}
.lead{color:#d9ceb2;font-size:16px;margin-bottom:26px}
.logo{width:76px;display:block;margin-bottom:22px;filter:drop-shadow(0 0 14px rgba(201,166,75,.35))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:var(--ink);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;padding:16px 28px;border-radius:40px;border:0;cursor:pointer;text-decoration:none;box-shadow:0 6px 24px rgba(201,166,75,.3);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--gold-l);border:1px solid rgba(201,166,75,.6);box-shadow:none}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:#b5a988}
.bar{height:6px;background:#2a271f;border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .4s ease}
.step{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#9d917a;margin-bottom:18px;display:flex;justify-content:space-between}
.step button{background:none;border:0;color:var(--gold-l);font:inherit;letter-spacing:.12em;cursor:pointer}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#1b1a16;border:1px solid rgba(201,166,75,.22);color:#efe6cf;border-radius:16px;padding:16px 18px;font:500 15.5px var(--sans);cursor:pointer;transition:.18s}
.opt:hover{border-color:var(--gold);background:#211f19}
.opt.sel{border-color:var(--gold-l);background:linear-gradient(120deg,rgba(156,122,44,.35),rgba(201,166,75,.18));box-shadow:0 0 16px rgba(201,166,75,.25)}
.opt .em{flex:0 0 40px;height:40px;border-radius:12px;background:#0e0e0e;display:grid;place-content:center;font-size:20px;border:1px solid rgba(201,166,75,.25)}
.res-badge{display:inline-block;background:var(--grad);color:var(--ink);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:7px 14px;border-radius:20px;margin-bottom:16px}
.res-icon{font-size:46px;line-height:1;margin-bottom:12px}
.res p{color:#d9ceb2;margin-bottom:14px}
.box{background:#0e0e0e;border:1px solid rgba(201,166,75,.25);border-radius:16px;padding:20px 20px 8px;margin:22px 0}
.box h3{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.box li{list-style:none;position:relative;padding:0 0 14px 30px;color:#e9e0c9;font-size:15px}
.box li b{color:#fff}
.box li:before{content:counter(t);counter-increment:t;position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--grad);color:var(--ink);font:700 11px var(--sans);display:grid;place-content:center}
.box ul{counter-reset:t}
.fix{border-left:3px solid var(--gold);padding:4px 0 4px 16px;color:#efe6cf;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45;margin:6px 0 24px}
.second{margin-top:10px;font-size:13px;color:#9d917a}
.ctas{display:flex;flex-direction:column;gap:12px}
@media(min-width:560px){.ctas{flex-direction:row}.ctas .btn{flex:1}}
.also{margin-top:22px;padding-top:18px;border-top:1px solid rgba(201,166,75,.18);font-size:14px;color:#b5a988;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.also a{color:var(--gold-l);font-weight:600;text-decoration:none}
.also button{background:none;border:0;color:var(--gold-l);font:600 14px var(--sans);cursor:pointer;padding:0}
.maria{display:flex;gap:14px;align-items:center;margin-top:24px}
.maria img{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 10%;border:2px solid var(--gold)}
.maria p{font-size:13px;color:#b5a988;margin:0}
.maria b{color:#fff;display:block;font-size:14px}
</style>
</head>
<body>
<div class="top"><div class="in"><a href="index.html">← MPF Coaching</a><a class="cta" href="index.html#pricing">Work with me</a></div></div>
<main class="stage" id="app"></main>
<script>
var P={
 weekend:{icon:'🍕',name:'The Weekend Undoer',short:'Spot on Monday to Friday, then the weekend wipes it out.',
  body:"You're not doing badly. Your weekdays are probably really good. But two big weekend days can cancel out five careful ones, so the scales never move and it feels like nothing works.",
  tips:["<b>Plan the weekend, don't avoid it.</b> Decide your Friday and Saturday treats in advance and fit them into your week.","<b>Bank a few calories.</b> Eat slightly less Monday to Thursday so you have room for the meal out or the drinks.","<b>Keep protein high on weekends.</b> A big protein breakfast makes the rest of the day far easier."],
  fix:"In coaching, we build your plan around your social life, not against it. Weekends included."},
 restart:{icon:'🔁',name:'The All-or-Nothing Restarter',short:'Perfect for a week, then one slip and it’s “start again Monday”.',
  body:"You've got loads of motivation. It's the all-or-nothing rules that keep tripping you up. One off day turns into an off week, and every restart begins from zero.",
  tips:["<b>Aim for 80%, not 100%.</b> A good week with one off day still gets results.","<b>Never miss twice.</b> After a slip, the very next meal is just a normal meal. No punishing, no restarting.","<b>Use rules you could keep for a year.</b> If you couldn't do it forever, it's a diet, not a plan."],
  fix:"In coaching, I give you a flexible plan and weekly check-ins, so one bad day stays one bad day."},
 under:{icon:'🥱',name:'The Under-Eater',short:'Eating too little, tired all the time, and the scales still won’t budge.',
  body:"It sounds backwards, but eating too little for too long makes you hungry, tired and more likely to binge, and low protein means you lose muscle instead of fat. You need a smarter amount, not less.",
  tips:["<b>Get protein in every meal.</b> Aim for a palm-sized portion or more, three to four times a day.","<b>Find your real numbers.</b> Use a proper calorie target instead of guessing as low as you can.","<b>Lift weights.</b> Training gives your body a reason to keep muscle while you lose fat."],
  fix:"In coaching, I set your calories and protein properly, then adjust them every week based on your results."},
 noplan:{icon:'🏃‍♀️',name:'The Hard Worker Without a Plan',short:'Training hard, sweating loads, but your body isn’t changing.',
  body:"Your effort isn't the problem. Without a plan that gets progressively harder, your body has no reason to change, and lots of cardio on its own often just makes you hungrier.",
  tips:["<b>Lift with a plan.</b> Repeat the same main lifts each week and add a little weight or reps over time.","<b>Track your training.</b> If you're not writing it down, you can't tell if you're progressing.","<b>Use cardio as a bonus.</b> Walking and steps are great, but weights are what shape your body."],
  fix:"In coaching, you get a programme built for you, so every session has a purpose and you can see your progress."},
 busy:{icon:'⏰',name:'The Busy Juggler',short:'Work, life, stress and not enough sleep, so your health keeps slipping down the list.',
  body:"You're not lazy, you're stretched. Plans that need two hours a day and perfect meal prep were never going to fit your life, so it's no wonder they didn't last.",
  tips:["<b>Go minimum, not maximum.</b> Three 45-minute sessions a week is plenty to get results.","<b>Have go-to meals.</b> Five or six easy high-protein meals you can make on autopilot.","<b>Protect your sleep.</b> Less sleep means more cravings, so treat it like part of your plan."],
  fix:"In coaching, I build a plan around your real schedule, so it still works on your busiest weeks."}
};
var Q=[
 {q:"How do your weekdays compare to your weekends?",o:[["📅","Weekdays are good, weekends go off the rails","weekend"],["🔁","Some weeks are perfect, some I give up completely","restart"],["🍽️","I barely eat during the day","under"],["🌀","Every day is different. I just fit things in where I can","busy"]]},
 {q:"What happens after a bad day of eating?",o:[["🗓️","I write the week off and start again on Monday","restart"],["✂️","I eat much less the next day to make up for it","under"],["🏃‍♀️","I do extra cardio to burn it off","noplan"],["🤷‍♀️","I don't really notice, I'm too busy","busy"]]},
 {q:"What does your training look like right now?",o:[["🚴‍♀️","Mostly cardio, classes or running","noplan"],["🏋️‍♀️","Weights, but no real plan","noplan"],["⏳","Whenever I can fit it in","busy"],["📋","I follow a plan but my results have stalled","under"]]},
 {q:"How much protein do you eat?",o:[["❓","No idea, honestly","under"],["🥗","Probably not enough","under"],["🍗","Decent in the week, less at weekends","weekend"],["📱","I track it most days","noplan"]]},
 {q:"What's your biggest struggle?",o:[["🍷","Social plans, takeaways and drinks","weekend"],["🔥","Staying motivated for more than a few weeks","restart"],["😴","Always tired or hungry","under"],["🧠","Time, stress and sleep","busy"]]},
 {q:"How many times have you “started again” this year?",o:[["♾️","I've lost count","restart"],["✌️","A couple of times, usually after a big weekend","weekend"],["🧱","I never stop, I'm just stuck","noplan"],["🚦","I find it hard to even start","busy"]]}
];
var app=document.getElementById('app'),ans=[],i=0;
function esc(s){return s}
function intro(){app.innerHTML='<div class="card"><img class="logo" src="img/logo.png" alt="MPF Coaching"><div class="kick">Free 60-second quiz</div><h1>What’s really stopping <em>your progress?</em></h1><p class="lead">Six quick questions. Find out what’s holding you back, and get three tips you can start using today.</p><button class="btn" id="go">Start the quiz →</button><div class="meta"><span>✓ 6 questions</span><span>✓ No email needed</span><span>✓ Personal tips</span></div><div class="maria"><img src="img/maria-profile.jpg" alt="Maria Paradise"><p><b>Maria Paradise</b>Fat loss &amp; body recomposition coach</p></div></div>';document.getElementById('go').onclick=function(){i=0;ans=[];q()}}
function q(){var x=Q[i];app.innerHTML='<div class="card"><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="step"><span>Question '+(i+1)+' of '+Q.length+'</span>'+(i?'<button id="bk">← Back</button>':'')+'</div><h2>'+x.q+'</h2><div class="opts">'+x.o.map(function(o,k){return '<button class="opt" data-k="'+k+'"><span class="em">'+o[0]+'</span><span>'+o[1]+'</span></button>'}).join('')+'</div></div>';
 setTimeout(function(){var b=app.querySelector('.bar i');if(b)b.style.width=((i+1)/Q.length*100)+'%'},30);
 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){b.classList.add('sel');ans[i]=x.o[+b.dataset.k][2];setTimeout(function(){i++;i<Q.length?q():res()},260)}});
 var bk=document.getElementById('bk');if(bk)bk.onclick=function(){i--;q()};window.scrollTo(0,0)}
function res(){var c={};ans.forEach(function(a,k){c[a]=(c[a]||0)+(k==Q.length-1?1.5:1)});var top=Object.keys(c).sort(function(a,b){return c[b]-c[a]});var r=P[top[0]],r2=top[1]&&c[top[1]]>=2?P[top[1]]:null;
 try{localStorage.setItem('mpfQuiz',top[0])}catch(e){}
 app.innerHTML='<div class="card res"><div class="res-badge">Your result</div><div class="res-icon">'+r.icon+'</div><h1 style="font-size:clamp(30px,7.5vw,42px)">'+r.name+'</h1><p style="color:#fff;font-weight:600">'+r.short+'</p><p>'+r.body+'</p>'+(r2?'<p class="second">With a bit of <b style="color:var(--gold-l)">'+r2.name+'</b> in there too.</p>':'')+'<div class="box"><h3>Start here this week</h3><ul>'+r.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div><p class="fix">'+r.fix+'</p><div class="ctas"><a class="btn" href="https://calendly.com/mpfcoaching-info/30">Book your free call</a><a class="btn ghost" href="index.html#pricing">See coaching options</a></div><div class="also"><a href="diet.html">Read my free dieting guide →</a><button id="again">↺ Take the quiz again</button></div><div class="maria"><img src="img/maria-profile.jpg" alt="Maria Paradise"><p><b>Want to fix this for good?</b>Tell me your result on our free call and we’ll start there.</p></div></div>';
 document.getElementById('again').onclick=intro;window.scrollTo(0,0)}
intro();
</script>
</body>
</html>
